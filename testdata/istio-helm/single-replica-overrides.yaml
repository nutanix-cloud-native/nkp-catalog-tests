---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-helm-config-overrides
  namespace: kommander
data:
  values.yaml: |
    # Disable the cacert-job post-install hook — it requires cert-manager's
    # kommander-ca ClusterIssuer which is not present in apptests Kind clusters.
    security:
      enabled: false
    istiod:
      autoscaleEnabled: false
      autoscaleMin: 1
      autoscaleMax: 1
    gateway:
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 1
      replicaCount: 1
