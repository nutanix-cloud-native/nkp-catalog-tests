name: Test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: self-hosted-nutanix-small

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install NIX
        uses: cachix/install-nix-action@v31

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          skip-nix-installation: true
          enable-cache: "false"
          refresh-cli: "true"

      - name: Run unit tests
        run: devbox run -- go test ./...

      - name: Run appscenarios unit tests
        working-directory: appscenarios
        run: devbox run -- go test ./...
