name: Black Duck Policy Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    runs-on: self-hosted-nutanix-small
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "adopt"

      - name: Black Duck PR Scan
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.type == 'pr') ||
          (github.event_name == 'pull_request')
        uses: blackduck-inc/black-duck-security-scan@v2.8.0
        env:
          DETECT_PROJECT_VERSION_NAME: ${{ github.base_ref }}
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          blackducksca_scan_full: false
          blackducksca_prComment_enabled: true
          blackducksca_scan_failure_severities: "BLOCKER,CRITICAL"

      - name: Black Duck Full Scan
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.type == 'full') ||
          (github.event_name == 'push')
        uses: blackduck-inc/black-duck-security-scan@v2.8.0
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          blackducksca_scan_full: true
          blackducksca_scan_failure_severities: "BLOCKER,CRITICAL"
